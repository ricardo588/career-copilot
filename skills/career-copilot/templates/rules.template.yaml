schema_version: 2
search:
  source_priority:
    - official_company_sites
    - official_ats
    - recruiters_and_headhunters
    - professional_networks
    - aggregators
  freshness_days: 14
  require_current_source: true
evaluation:
  hard_exclusions: []
  preferred_signals: []
  unknown_is_not_match: true
tracker:
  backend: local_csv
  file: tracker.csv
  update_policy: ask
  stable_identity: true
communications:
  first_contact_style: concise
  external_action_mode: draft_only
  external_action_mode_locked: false
human_path:
  enabled: true
  search_contacts: true
  search_recruiter_or_poster: true
  search_hiring_manager: true
  require_current_source: true
interviewer_research:
  enabled_when_interview_confirmed: true
  require_direct_source: true
  separate_facts_from_hypotheses: true
