name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate distributable bundle
        run: python3 scripts/validate_bundle.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
